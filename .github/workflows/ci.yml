name: AIrobot checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Validate the 3D module syntax
        run: |
          node --check three-scene.js
          node --check simulator-motion.js
      - name: Syntax checks
        run: |
          node --check app.js
          node --check protocol.js
          node --check netlify/functions/intent.mjs
      - name: Unit tests
        run: npm test
      - name: Build Vercel and Netlify static site
        run: npm run build
      - name: Confirm browser entry and serverless API
        run: |
          test -s dist/index.html
          test -s dist/app.js
          node --check api/intent.js

