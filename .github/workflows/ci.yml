name: AIrobot checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check protocol.js
          node --check netlify/functions/intent.mjs
      - name: Unit tests
        run: npm test
